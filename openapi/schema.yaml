          multipart/form-data:
            schema:
              type: object
              required:
              - payload
              properties:
                payload:
                  type: string
                  description: JSON encoded YarnColorsWrite
              additionalProperties:
                type: string
                format: binary
              description: Upload each color image as color_image_<zero-based row
