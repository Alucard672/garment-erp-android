components:
  schemas:
    AccessoryColorWrite:
      type: object
      properties:
        color_id:
          type: integer
          minimum: 1
        code:
          type: string
          default: ''
          maxLength: 48
        hex:
          type: string
          pattern: ^#[0-9a-fA-F]{6}(?:[0-9a-fA-F]{2})?$
    AccessoryOptionsWrite:
      type: object
      properties:
        request_key:
          type: string
          format: uuid
        expected_version:
          type: string
          pattern: ^[0-9a-f]{64}$
        colors:
          type: array
          items:
            $ref: '#/components/schemas/AccessoryColorWrite'
        specifications:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSpec'
      required:
      - colors
      - expected_version
      - request_key
      - specifications
    AllocationRead:
      type: object
      properties:
        source_id:
          type: integer
        order_code:
          type: string
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - order_code
      - quantity
      - source_id
    AllocationWrite:
      type: object
      properties:
        order_line_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
      required:
      - order_line_id
      - quantity
    ApiError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
      required:
      - code
      - detail
      - request_id
    AttributeChoice:
      type: object
      properties:
        attribute:
          $ref: '#/components/schemas/AttributeEnum'
        entry_id:
          type: integer
          minimum: 1
      required:
      - attribute
      - entry_id
    AttributeEnum:
      enum:
      - brand
      - category
      - season
      - wave
      - gauge
      - grade
      - design_group
      type: string
      description: |-
        * `brand` - brand
        * `category` - category
        * `season` - season
        * `wave` - wave
        * `gauge` - gauge
        * `grade` - grade
        * `design_group` - design_group
    AttributeRead:
      type: object
      properties:
        attribute:
          $ref: '#/components/schemas/AttributeEnum'
        entry_id:
          type: integer
          minimum: 1
        label:
          type: string
      required:
